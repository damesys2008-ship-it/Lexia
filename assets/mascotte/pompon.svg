<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 240 290" width="240" height="290">
  <!-- Pompon, la mascotte de Lexia. Dessin d'après la planche 02 (viewBox 0 6 240 290).
       Couleurs : corps #fff, pompons / queue / pieds #e0457b, joues #f1abc3, contour et yeux #241b4b.
       Trait : 3 (2,2 pour les détails du visage), bouts arrondis.

       Mouvement : css/composants/mascotte.css, piloté par data-expression (huit visages) et data-etat.
       Un visage = un groupe pompon__visage, suivi du nom de l expression (un seul visible à la fois).
       Les oreilles et les bras sont dessinés autour de leur point d'attache (translate sur le groupe parent),
       pour que la rotation CSS pivote exactement à cet endroit.

       Emplacements d'accessoires (groupes data-emplacement, vides ici, dans l'ordre de dessin).
       Coordonnées du viewBox ; le corps blanc va de x 62 à 178 et de y 135 à 262 :
         dos      derrière le corps : cape, ailes, sac. Zone centrée sur (120, 200).
         queue    sur le pompon de queue, centré (180, 238), rayon 17.
         pieds    sur les deux pieds, centrés (102, 268) et (138, 268), rayon 20 x 11.
         corps    sur le torse, y 150 à 262, sous le visage.
         col      bande autour de (120, 224), sous la bouche.
         visage   lunettes, masque : autour des yeux, centré (120, 185).
         tete     chapeaux : posés sur le haut du corps (120, 135), entre les tiges.
         pompons  rubans, bonnets pour oreilles : sur les pompons (97, 108) et (143, 108), rayon 17, tiges comprises.
         main     objet tenu dans la main droite, centrée (178, 210).
       Les pompons ne sont jamais cachés : un chapeau se pose entre les tiges. -->

  <g transform="translate(120 268)">
    <g class="pompon__respire">
      <g class="pompon__penche">
        <g transform="translate(-120 -268)" stroke="#241b4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

          <g data-emplacement="dos"></g>

          <circle cx="180" cy="238" r="17" fill="#e0457b"/>
          <g data-emplacement="queue"></g>

          <ellipse cx="102" cy="268" rx="20" ry="11" fill="#e0457b"/>
          <ellipse cx="138" cy="268" rx="20" ry="11" fill="#e0457b"/>
          <g data-emplacement="pieds"></g>

          <g transform="translate(104 140)">
            <g class="pompon__oreille pompon__oreille--gauche">
              <line x1="0" y1="0" x2="-4" y2="-22"/>
              <circle cx="-7" cy="-32" r="17" fill="#e0457b"/>
            </g>
          </g>
          <g transform="translate(136 140)">
            <g class="pompon__oreille pompon__oreille--droite">
              <line x1="0" y1="0" x2="4" y2="-22"/>
              <circle cx="7" cy="-32" r="17" fill="#e0457b"/>
            </g>
          </g>

          <path class="pompon__corps" d="M120 135 C170 135 182 175 178 210 C175 245 152 262 120 262 C88 262 65 245 62 210 C58 175 70 135 120 135 Z" fill="#fff"/>
          <g data-emplacement="corps"></g>
          <g data-emplacement="col"></g>

          <g stroke="none">
            <ellipse class="pompon__joue" cx="90" cy="200" rx="8" ry="5" fill="#f1abc3"/>
            <ellipse class="pompon__joue" cx="150" cy="200" rx="8" ry="5" fill="#f1abc3"/>
            <ellipse cx="120" cy="196" rx="4" ry="3" fill="#e0457b"/>
          </g>

          <!-- Content : yeux ronds, sourire. -->
          <g class="pompon__visage pompon__visage--content" transform="translate(120 193)">
            <g class="pompon__oeil">
              <circle cx="-15" cy="-8" r="5.5" fill="#241b4b" stroke="none"/>
              <circle cx="-16.5" cy="-9.5" r="1.8" fill="#fff" stroke="none"/>
            </g>
            <g class="pompon__oeil">
              <circle cx="15" cy="-8" r="5.5" fill="#241b4b" stroke="none"/>
              <circle cx="13.5" cy="-9.5" r="1.8" fill="#fff" stroke="none"/>
            </g>
            <path d="M-9 11 Q0 20 9 11" fill="none"/>
          </g>

          <!-- Bravo ! : yeux fermés en arcs, bouche ouverte. -->
          <g class="pompon__visage pompon__visage--bravo" transform="translate(120 193)">
            <path d="M-21 -6 Q-15 -15 -9 -6 M9 -6 Q15 -15 21 -6" fill="none"/>
            <path d="M-12 10 Q0 28 12 10 Z" fill="#241b4b"/>
            <ellipse cx="0" cy="19" rx="5" ry="3" fill="#e0457b" stroke="none"/>
          </g>

          <!-- Presque ! : sourcils inquiets, goutte, bouche ondulée. -->
          <g class="pompon__visage pompon__visage--presque" transform="translate(120 193)" stroke-width="2.2">
            <circle cx="-13" cy="-8" r="5.5" fill="#241b4b" stroke="none"/>
            <circle cx="-14.5" cy="-9.5" r="1.8" fill="#fff" stroke="none"/>
            <circle cx="17" cy="-8" r="5.5" fill="#241b4b" stroke="none"/>
            <circle cx="15.5" cy="-9.5" r="1.8" fill="#fff" stroke="none"/>
            <path d="M-22 -18 L-10 -22 M10 -22 L22 -18" fill="none"/>
            <path d="M-9 14 Q-4.5 10 0 14 Q4.5 18 9 14" fill="none" stroke-width="3"/>
            <path d="M40 -26 Q46 -16 40 -12 Q34 -16 40 -26 Z" fill="#b9d6fa"/>
          </g>

          <!-- Je réfléchis : regard de côté, bouche en biais, bulle de pensée. -->
          <g class="pompon__visage pompon__visage--reflechis" transform="translate(120 193)">
            <circle cx="-18" cy="-12" r="5.5" fill="#241b4b" stroke="none"/>
            <circle cx="-19.5" cy="-13.5" r="1.8" fill="#fff" stroke="none"/>
            <circle cx="12" cy="-12" r="5.5" fill="#241b4b" stroke="none"/>
            <circle cx="10.5" cy="-13.5" r="1.8" fill="#fff" stroke="none"/>
            <path d="M2 14 L11 12" fill="none"/>
            <circle cx="44" cy="-36" r="3" fill="#fff" stroke-width="2.2"/>
            <circle cx="53" cy="-49" r="4.5" fill="#fff" stroke-width="2.2"/>
          </g>

          <!-- Waouh ! : grands yeux, sourcils hauts, bouche ronde. -->
          <g class="pompon__visage pompon__visage--waouh" transform="translate(120 193)">
            <g class="pompon__oeil">
              <circle cx="-15" cy="-8" r="8" fill="#241b4b" stroke="none"/>
              <circle cx="-17.2" cy="-10.2" r="3" fill="#fff" stroke="none"/>
            </g>
            <g class="pompon__oeil">
              <circle cx="15" cy="-8" r="8" fill="#241b4b" stroke="none"/>
              <circle cx="12.8" cy="-10.2" r="3" fill="#fff" stroke="none"/>
            </g>
            <path d="M-23 -23 Q-16 -29 -9 -24 M9 -24 Q16 -29 23 -23" fill="none" stroke-width="2.2"/>
            <ellipse cx="0" cy="17" rx="5" ry="6" fill="#241b4b" stroke="none"/>
          </g>

          <!-- Fier : yeux plissés, sourire, étoile jaune. -->
          <g class="pompon__visage pompon__visage--fier" transform="translate(120 193)">
            <path d="M-21 -9 Q-15 -3 -9 -9 M9 -9 Q15 -3 21 -9" fill="none"/>
            <path d="M-10 11 Q0 21 10 11" fill="none"/>
            <path d="M48 -44 L50.6 -37.6 L57.5 -37.1 L52.3 -32.6 L53.9 -25.9 L48 -29.5 L42.1 -25.9 L43.7 -32.6 L38.5 -37.1 L45.4 -37.6 Z" fill="#ffc93c" stroke-width="2.2"/>
          </g>

          <!-- Dodo : yeux fermés, petite bouche, « z ». -->
          <g class="pompon__visage pompon__visage--dodo" transform="translate(120 193)">
            <path d="M-21 -7 Q-15 -3 -9 -7 M9 -7 Q15 -3 21 -7" fill="none"/>
            <ellipse cx="0" cy="15" rx="3" ry="2.5" fill="#241b4b" stroke="none"/>
            <path d="M38 -30 H46 L38 -21 H46" fill="none" stroke-width="2.2"/>
            <path d="M48 -46 H60 L48 -33 H60" fill="none" stroke-width="2.6"/>
          </g>

          <!-- Câlin : yeux en cœur, joues plus larges. -->
          <g class="pompon__visage pompon__visage--calin" transform="translate(120 193)" stroke-width="2.2">
            <path d="M-15 -3 C-25 -9 -21 -18 -15 -13 C-9 -18 -5 -9 -15 -3 Z" fill="#e0457b"/>
            <path d="M15 -3 C5 -9 9 -18 15 -13 C21 -18 25 -9 15 -3 Z" fill="#e0457b"/>
            <path d="M-9 12 Q0 20 9 12" fill="none" stroke-width="3"/>
          </g>

          <g data-emplacement="visage"></g>

          <!-- Bras : ellipses accrochées aux épaules (gauche 70 195, droite 170 195). -->
          <g transform="translate(70 195)">
            <g class="pompon__bras pompon__bras--gauche">
              <ellipse cx="-8" cy="15" rx="11" ry="16" transform="rotate(20 -8 15)" fill="#fff"/>
            </g>
          </g>
          <g transform="translate(170 195)">
            <g class="pompon__bras pompon__bras--droit">
              <ellipse cx="8" cy="15" rx="11" ry="16" transform="rotate(-20 8 15)" fill="#fff"/>
              <g data-emplacement="main"></g>
            </g>
          </g>

          <g data-emplacement="tete"></g>
          <g data-emplacement="pompons"></g>

          <!-- Confettis de la fête : visibles seulement dans l'état « fete ». -->
          <g class="pompon__confettis" stroke="none">
            <rect class="pompon__confetti" x="70" y="60" width="8" height="8" rx="2" fill="#ffc93c"/>
            <circle class="pompon__confetti" cx="105" cy="45" r="4.5" fill="#e0457b"/>
            <rect class="pompon__confetti" x="140" y="55" width="8" height="8" rx="2" fill="#6b4bd8"/>
            <circle class="pompon__confetti" cx="175" cy="48" r="4.5" fill="#0e7c66"/>
            <rect class="pompon__confetti" x="55" y="95" width="7" height="7" rx="2" fill="#e0457b"/>
            <circle class="pompon__confetti" cx="190" cy="90" r="4" fill="#ffc93c"/>
            <rect class="pompon__confetti" x="120" y="30" width="8" height="8" rx="2" fill="#0e7c66"/>
            <circle class="pompon__confetti" cx="85" cy="25" r="4" fill="#6b4bd8"/>
            <rect class="pompon__confetti" x="160" y="25" width="7" height="7" rx="2" fill="#ffc93c"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
