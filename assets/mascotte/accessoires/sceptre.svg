<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 240 290" width="240" height="290">
  <!-- Calque « sceptre » pour Pompon, emplacement main. Dessiné en coordonnées du viewBox ; le groupe ci-dessous compense le décalage (170, 195) du bras droit, où l'emplacement est rattaché. -->
  <g>
    <g transform="translate(-170 -195)">
      <path d="M184 228 L198 166" stroke="#241B4B" stroke-width="8" stroke-linecap="round"/>
      <path d="M184 228 L198 166" stroke="#FFC93C" stroke-width="4" stroke-linecap="round"/>
      <circle cx="199" cy="161" r="7" fill="#D6246E" stroke="#241B4B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
