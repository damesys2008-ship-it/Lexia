<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 240 290" width="240" height="290">
  <!-- Calque « cuillere » pour Pompon, emplacement main. Dessiné en coordonnées du viewBox ; le groupe ci-dessous compense le décalage (170, 195) du bras droit, où l'emplacement est rattaché. -->
  <g>
    <g transform="translate(-170 -195)">
      <path d="M184 226 L198 178" stroke="#241B4B" stroke-width="8" stroke-linecap="round"/>
      <path d="M184 226 L198 178" stroke="#A86B3C" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="200" cy="170" rx="7" ry="10" transform="rotate(16 200 170)" fill="#A86B3C" stroke="#241B4B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
