      <ellipse cx="62" cy="210" rx="13" ry="18" transform="rotate(20 62 210)" fill="#C94A1F" stroke="#241B4B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="178" cy="210" rx="13" ry="18" transform="rotate(-20 178 210)" fill="#C94A1F" stroke="#241B4B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M54 222 Q62 228 70 224 M170 224 Q178 228 186 222" fill="none" stroke="#fff" stroke-width="4"/>
    </g>
  </g>
