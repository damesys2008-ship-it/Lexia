<!doctype html>
<html lang="fr">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://uzpfsifwjosipxfohkoi.supabase.co; object-src 'none'; base-uri 'self'">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="assets/icones/icone-180.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/composants.css">
  <link rel="stylesheet" href="css/ecran-bas.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="entete">
    <div class="entete__contenu">
      <a class="entete__lien" href="#/accueil">
        <img class="entete__logo" src="assets/mascotte/pompon-logo.svg" alt="">
        <span class="entete__titre">Lexia</span>
        <span class="sr-seulement">, retour à l'accueil</span>
      </a>
      <div class="entete__outils">
        <div class="barre-etat" id="barre-etat"></div>
        <button type="button" class="bouton bouton--icone bouton-muet" id="bouton-muet" aria-pressed="false" aria-label="Couper le son">

            <path d="M4 9H8L13 5V19L8 15H4Z M16 9a4 4 0 0 1 0 6"/>

    </div>

  <main id="contenu" class="conteneur contenu" tabindex="-1">
    <noscript>
      <p class="avertissement-noscript">Lexia a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, puis recharge la page.</p>
    </noscript>
  </main>

  <div id="zone-bannieres" class="zone-bannieres"></div>
  <div id="zone-toasts" class="zone-toasts" aria-live="polite"></div>
  <div id="zone-modale" class="zone-modale"></div>
